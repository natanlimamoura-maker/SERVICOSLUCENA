<!DOCTYPE html>
<html lang="pt-BR" class="dark h-full bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Título & Metadados -->
    <title>RodagemPro - Controle de Fretes e Saídas</title>
    <meta name="description" content="Aplicativo de controle financeiro para caminhoneiros. Registre fretes, combustível, pedágios, comprovantes e acompanhe seu lucro real." />
    <meta name="author" content="RodagemPro" />

    <!-- Cores de Tema & Status Bar (Mobile Nativo) -->
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RodagemPro" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Ícones PWA e Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fontes Google (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS (Suporte rápido para estilos utilitários) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
                900: '#0c4a6e',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Prevenção de Pinch-Zoom acidental em formulários mobile -->
    <style>
      body {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        font-family: 'Inter', sans-serif;
      }
      /* Estilização da barra de rolagem para telas sensíveis ao toque */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 9999px;
      }
    </style>
  </head>
  <body class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-sky-500 selection:text-white">
    <!-- Elemento Raiz do React -->
    <div id="root" class="min-h-full flex flex-col"></div>

    <!-- Script de Entrada Principal do Vite/React -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
